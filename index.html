<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>办公室游戏厅</title>
<style>
  :root{
    --bg1:#0f1226; --bg2:#1b2350; --card:#161b3a; --line:rgba(255,255,255,.08);
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --green:#4ade80;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,var(--bg2),var(--bg1));
    color:var(--text); display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 48px;
  }
  header{text-align:center; margin-bottom:28px;}
  header h1{margin:0; font-size:34px; letter-spacing:2px;}
  header p{margin:8px 0 0; color:var(--muted); font-size:15px;}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px; width:100%; max-width:760px;
  }
  .card{
    display:block; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:22px; transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .card:hover, .card:active{
    transform:translateY(-4px); border-color:var(--accent);
    box-shadow:0 14px 30px rgba(56,189,248,.18);
  }
  .icon{font-size:40px; line-height:1; margin-bottom:14px;}
  .card h2{margin:0 0 6px; font-size:20px;}
  .card p{margin:0; color:var(--muted); font-size:13px; line-height:1.5; min-height:38px;}
  .play{display:inline-block; margin-top:14px; color:var(--green); font-weight:600; font-size:14px;}
  .card.disabled{opacity:.5; pointer-events:none; filter:grayscale(.4);}
  .card.disabled .play{color:var(--muted);}
  footer{margin-top:40px; color:var(--muted); font-size:12px; text-align:center; line-height:1.7;}
</style>
</head>
<body>
  <header>
    <h1>🎮 办公室游戏厅</h1>
    <p>摸鱼时间，来一局</p>
  </header>

  <main class="grid">
    <!--
      ===== 如何新增一个游戏 =====
      1) 在仓库里新建一个 xxx.html（放游戏页面）
      2) 复制下面整段 <a class="card"> 卡片，把 href / icon / 标题 / 描述改掉即可
      3) 提交后大厅自动多出一张卡片
    -->
    <a class="card" href="snake.html">
      <div class="icon">🐍</div>
      <h2>贪吃蛇</h2>
      <p>经典休闲，越吃越长。支持电脑键盘与手机触屏。</p>
      <span class="play">开始游戏 →</span>
    </a>

    <!-- 占位卡片：演示新增游戏的结构，去掉 class 里的 disabled 并改链接即可启用 -->
    <div class="card disabled">
      <div class="icon">🎲</div>
      <h2>更多游戏</h2>
      <p>新游戏筹备中，敬请期待。</p>
      <span class="play">敬请期待</span>
    </div>
  </main>

  <footer>
    内部休闲小游戏合集 · 持续更新中
  </footer>
</body>
</html>
